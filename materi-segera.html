<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Materi Segera Hadir — PGRI POWER 2026</title>
  <meta name="description" content="Materi Bimtek PGRI POWER 2026 sedang disiapkan oleh panitia.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 55%, #3b82f6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: white;
      -webkit-font-smoothing: antialiased;
      position: relative;
      overflow: hidden;
    }

    /* Dekoratif background */
    body::before,
    body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    body::before {
      width: 400px;
      height: 400px;
      top: -100px;
      right: -100px;
      background: radial-gradient(circle, rgba(255,255,255,0.12) 0%, transparent 70%);
    }

    body::after {
      width: 350px;
      height: 350px;
      bottom: -100px;
      left: -100px;
      background: radial-gradient(circle, rgba(245,158,11,0.15) 0%, transparent 70%);
    }

    /* Card utama */
    .card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 48px 32px;
      max-width: 460px;
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px rgba(15, 23, 42, 0.3);
      position: relative;
      z-index: 1;
      animation: slideUp 0.7s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUp {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Badge kecil di atas */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 6px 14px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      margin-bottom: 24px;
    }

    .badge .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fbbf24;
      box-shadow: 0 0 8px #fbbf24;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    /* Ikon utama */
    .icon-wrap {
      width: 88px;
      height: 88px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, rgba(255,255,255,0.25), rgba(255,255,255,0.1));
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    /* Judul */
    h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 12px;
      line-height: 1.25;
    }

    /* Deskripsi */
    .desc {
      font-size: 14px;
      opacity: 0.85;
      line-height: 1.6;
      margin-bottom: 28px;
      font-weight: 500;
    }

    /* Info box kecil */
    .info-box {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: rgba(251, 191, 36, 0.15);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 12px;
      font-weight: 600;
      color: #fde68a;
      margin-bottom: 28px;
    }

    /* Footer */
    .footer {
      font-size: 11px;
      opacity: 0.65;
      font-weight: 500;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.12);
    }

    .footer strong {
      color: #fbbf24;
      font-weight: 700;
    }

    /* Responsive */
    @media (max-width: 480px) {
      .card { padding: 36px 24px; border-radius: 20px; }
      h1 { font-size: 21px; }
      .icon-wrap { width: 76px; height: 76px; font-size: 34px; }
    }
  </style>
</head>
<body>

  <div class="card">

    <div class="badge">
      <span class="dot"></span>
      <span>Coming Soon</span>
    </div>

    <div class="icon-wrap">
      📚
    </div>

    <h1>Materi Belum Diunggah</h1>

    <p class="desc">
      Materi Bimtek PGRI POWER 2026 sedang dipersiapkan oleh panitia. 
      Silakan cek kembali halaman ini setelah kegiatan berlangsung.
    </p>

    <div class="info-box">
      <span>⏳</span>
      <span>Update segera setelah sesi selesai</span>
    </div>

    <div class="footer">
      © 2026 <strong>PGRI Cabang Sine</strong> · Bimtek PGRI POWER
    </div>

  </div>

</body>
</html>
